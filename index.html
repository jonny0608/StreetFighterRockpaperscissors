<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Street Fighter II - RPS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <h1>Street Fighter II - RPS</h1>
      <p class="welcome" id="welcomeText">Welcome!</p>
      <p class="round" id="roundText">Round 1 of 5</p>
    </header>

    <div class="score-row">
      <div class="scorebox">
        <span id="userLabel">Player</span> Wins: <span id="userWins">0</span>
      </div>
      <div class="scorebox">
        Computer Wins: <span id="computerWins">0</span>
      </div>
    </div>

    <div class="health-bars">
      <div class="health-bar-container">
        <div class="health-bar player-health"></div>
      </div>
      <div class="health-bar-container">
        <div class="health-bar computer-health"></div>
      </div>
    </div>

    <div class="fighters-area">
      <div class="fighter player-fighter">
        <div class="fighter-sprite player-sprite"></div>
        <p class="fighter-name" id="playerNameTag">Player</p>
      </div>

      <div class="fighter computer-fighter">
        <div class="fighter-sprite computer-sprite"></div>
        <p class="fighter-name">Computer</p>
      </div>
    </div>

    <div class="choices-area">
      <div class="choice-card">
        <h3 id="userChoiceTitle">Player Move</h3>
        <p id="userChoiceDisplay">—</p>
      </div>
      <div class="choice-card">
        <h3>Computer Move</h3>
        <p id="computerChoiceDisplay">—</p>
      </div>
    </div>

    <div class="move-selection" id="choiceButtons">
      <button class="move-btn" data-move="hadouken">Hadouken</button>
      <button class="move-btn" data-move="shoryuken">Shoryuken</button>
      <button class="move-btn" data-move="hurricane">Hurricane Kick</button>
    </div>

    <div class="result-display">
      <p class="result-text" id="resultText">Choose your move!</p>
    </div>

    <button class="move-btn reset-btn" id="resetBtn">Reset</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
